name: Staging - Test and Lint

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python Syntax Check (Linting)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Tests
      env:
        PYTHONPATH: .
        AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_MODEL: ${{ secrets.HF_MODEL }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
        LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
        LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: pytest tests/ -v
